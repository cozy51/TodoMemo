<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TodoMemo</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="markdown.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>TodoMemo</span>
        </div>
        <div class="header-actions">
          <button id="backupButton" class="icon-button" type="button" aria-label="全データをバックアップ" title="全データをバックアップ">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12M7.5 10.5 12 15l4.5-4.5M5 20h14"/>
            </svg>
          </button>
          <button id="editTaskButton" class="icon-button" type="button" aria-label="今のタスクを編集" title="編集" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m14.5 5.5 4 4M4 20l4.1-.8L19 8.3a1.4 1.4 0 0 0 0-2l-1.3-1.3a1.4 1.4 0 0 0-2 0L4.8 15.9 4 20Z"/>
            </svg>
          </button>
          <button id="openOrganizer" class="icon-button" type="button" aria-label="整理画面を開く" title="整理画面を開く">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h10M4 12h16M4 17h7M17 4v6M14 7h6M14 14v6M11 17h6"/>
            </svg>
          </button>
        </div>
      </header>

      <section id="taskView" class="task-view" hidden>
        <p class="eyebrow">今すること</p>
        <div class="task-case-row">
          <p id="taskCaseNumber" class="case-number"></p>
          <button id="copyTaskButton" class="copy-task-button" type="button">案件COPY</button>
        </div>
        <h1 id="taskTitle" class="task-title"></h1>
        <p id="taskParentCase" class="parent-case-badge" hidden></p>
        <div id="taskTags" class="tag-list" hidden></div>
        <p id="taskDue" class="task-due"></p>
        <div class="task-links-section">
          <div class="task-links-heading">
            <span>関連リンク</span>
            <button id="taskPasteLinkButton" class="paste-link-button" type="button">📋 URLを取り込む</button>
          </div>
          <div id="taskLinks" class="task-links" aria-label="関連リンク" hidden></div>
        </div>
        <div id="taskContent" class="task-content markdown-body"></div>
      </section>

      <section id="editView" class="edit-view" hidden>
        <div class="edit-heading">
          <div>
            <p class="eyebrow">今することを編集</p>
            <p id="editCaseNumber" class="case-number"></p>
          </div>
          <div class="edit-status">
            <span id="autoSaveStatus" class="save-status" role="status" aria-live="polite">保存済み</span>
            <button id="cancelEditTop" class="text-button" type="button">閉じる</button>
          </div>
        </div>
        <form id="editTaskForm" novalidate>
          <label class="field">
            <span>タイトル</span>
            <input id="editTitleInput" type="text" maxlength="100" required>
            <small id="editTitleError" class="field-error" aria-live="polite"></small>
          </label>
          <label class="field">
            <span>親案件 <em>任意</em></span>
            <select id="editParentCaseSelect">
              <option value="">親案件なし</option>
            </select>
            <small class="field-hint">登録済みの親案件から選択できます。</small>
          </label>
          <div class="field due-field">
            <label for="editDueDateInput">期限 <em>任意</em></label>
            <div class="date-input-row">
              <input id="editDueDateInput" type="date">
              <button id="clearEditDueDate" class="clear-date-button" type="button" hidden>期限を削除</button>
            </div>
          </div>
          <fieldset id="editTagsField" class="tags-field" hidden>
            <legend>分類タグ</legend>
            <div id="editTagOptions" class="tag-options"></div>
          </fieldset>
          <div class="links-field">
            <div class="links-field-heading">
              <span class="links-field-label">関連リンク <em>3件まで</em></span>
              <button id="editPasteLinkButton" class="paste-link-button" type="button">📋 クリップボードから追加</button>
            </div>
            <div id="editLinkInputs" class="link-inputs"></div>
            <small id="editLinkMessage" class="field-hint" role="status" aria-live="polite">URLまたはメールアドレスを登録できます。</small>
          </div>
          <label class="field content-field">
            <span>内容</span>
            <div class="content-highlight-wrap">
              <div id="editContentHighlightBackdrop" class="content-highlight-backdrop" aria-hidden="true"></div>
              <textarea id="editContentInput" rows="8" maxlength="5000" placeholder="Markdown記法が使えます"></textarea>
            </div>
            <small class="field-hint">文字列を選択すると、同じ文字列をハイライトします。Alt+クリックで編集位置を追加し、矢印キーで全カーソルを同時移動できます。</small>
          </label>
        </form>
      </section>

      <section id="emptyView" class="empty-view" hidden>
        <div class="empty-icon" aria-hidden="true">✓</div>
        <p class="eyebrow">今すること</p>
        <h1>すべて片づきました</h1>
        <p>新しいタスクは整理画面から追加できます。</p>
        <button id="openOrganizerEmpty" class="secondary-button" type="button">タスクを追加</button>
      </section>
    </main>

    <div id="popupToast" class="popup-toast" role="status" aria-live="polite" hidden></div>

    <script src="storage.js"></script>
    <script src="markdown.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
